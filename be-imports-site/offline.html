<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080F1C">
  <title>Sem conexão — BE IMPORTS</title>
  <style>
    *{box-sizing:border-box}
    body{min-height:100dvh;display:grid;place-items:center;margin:0;padding:28px;background:#080F1C;color:#fff;font:16px/1.5 system-ui,-apple-system,sans-serif;text-align:center}
    main{width:min(100%,440px)}
    img{display:block;width:min(72%,260px);height:auto;margin:0 auto 24px}
    h1{margin:0 0 12px;font-size:clamp(28px,7vw,40px);line-height:1.1}
    p{margin:0 0 28px;color:#e0e2e7}
    button{min-height:48px;padding:12px 24px;border:1px solid #D6C390;border-radius:5px;background:#D6C390;color:#080F1C;font:700 15px system-ui,-apple-system,sans-serif;cursor:pointer}
    button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo-original.webp" alt="BE IMPORTS" width="1774" height="887">
    <h1>Você está sem conexão</h1>
    <p>Conecte-se para consultar preços, estoque e ofertas atualizados. Pedidos pelo WhatsApp precisam de internet.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
